name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          # Symfony 8.0 and 8.1 require PHP 8.4+
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          echo "📦 Installing dependencies for Symfony ${{ matrix.symfony }}..."
          # doctrine/doctrine-bundle ^3.0 requires PHP ^8.4; use ^2.10 on PHP 8.2/8.3.
          if [ "${{ matrix.php }}" = "8.4" ] || [ "${{ matrix.php }}" = "8.5" ]; then
            DOCTRINE_BUNDLE='doctrine/doctrine-bundle:^3.0'
          else
            DOCTRINE_BUNDLE='doctrine/doctrine-bundle:^2.10'
          fi
          composer require \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/security-core:^${{ matrix.symfony }} \
            symfony/property-access:^${{ matrix.symfony }} \
            symfony/config:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            doctrine/orm:^3.0 \
            "$DOCTRINE_BUNDLE" \
            --no-interaction --no-update
          composer require symfony/yaml:^${{ matrix.symfony }} --dev --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage (PHP 8.2 with Symfony 7.4 only)
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage

          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage report"
            exit 1
          fi

          echo "✅ All tests passed, validating 100% coverage..."

          # Validate that coverage is 100%
          php -r "
          if (!file_exists('coverage.xml')) {
              echo 'ERROR: coverage.xml file was not generated\n';
              exit(1);
          }

          \$coverage = simplexml_load_file('coverage.xml');
          if (\$coverage === false) {
              echo 'ERROR: Could not read coverage.xml\n';
              exit(1);
          }

          \$metrics = \$coverage->project->metrics;
          \$elements = (float)\$metrics['elements'];
          \$coveredElements = (float)\$metrics['coveredelements'];

          if (\$elements == 0) {
              echo 'No elements to cover\n';
              exit(0);
          }

          \$percentage = (\$coveredElements / \$elements) * 100;

          echo \"Coverage: \$coveredElements/\$elements (\$percentage%)\n\";

          if (\$percentage < 100) {
              echo \"ERROR: Coverage must be 100%. Current: \$percentage%\n\";
              exit(1);
          }

          echo \"✅ 100% coverage confirmed\n\";
          "

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    # Only apply fixes automatically on push to main/master, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  igor:
    name: Igor (FrankenPHP worker state, REQ-CS-008)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (fails on any KO)
        run: composer igor

  databases:
    name: Databases (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4', url: 'mysql://root@127.0.0.1:3306/audit_test?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'MariaDB 11.4', url: 'mysql://root@127.0.0.1:3307/audit_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16', url: 'postgresql://postgres@127.0.0.1:5432/audit_test?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root@127.0.0.1:3306/audit_test?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root@127.0.0.1:3307/audit_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres@127.0.0.1:5432/audit_test?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: audit_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: audit_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config platform.php 8.4.1
          composer update --prefer-dist --no-progress --no-interaction

      - name: Use DBAL 3
        if: ${{ matrix.dbal != '' }}
        # doctrine/doctrine-bundle 3.x needs DBAL 4: DBAL 3 runs with DoctrineBundle 2 (and so Symfony 7.4), which does not
        # turn on native lazy objects: the ORM then needs symfony/var-exporter 7 for its LazyGhost proxies.
        run: |
          composer require --no-update --no-interaction "doctrine/dbal:${{ matrix.dbal }}" "doctrine/doctrine-bundle:^2.10" "symfony/var-exporter:^7.4"
          composer update --no-interaction --no-progress --with-all-dependencies
          composer show | grep -E '^(doctrine/dbal|doctrine/doctrine-bundle|symfony/framework-bundle) '

      - name: Two-connection lock and race tests (REQ-RUNTIME-003)
        timeout-minutes: 10
        env:
          AUDIT_KIT_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped --testsuite Database

      - name: Unit and integration suites on this doctrine/dbal
        timeout-minutes: 10
        # On DBAL 3, skip the tests whose stubs use DBAL 4 API (group dbal4-only).
        run: vendor/bin/phpunit --no-coverage --testsuite Unit,Integration ${{ matrix.dbal != '' && '--exclude-group dbal4-only' || '' }}

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/audit-kit-bundle` without updating them), and the demo lock must install what
  # the bundle requires (the demo installs from its lock, so a requirement added later is never installed and the demo
  # fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config platform.php 8.4.1
          composer update --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Unit and integration suites at the floor
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage --testsuite Unit,Integration

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          composer test-coverage

          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate 100% coverage
        run: |
          echo "📊 Validating 100% coverage..."

          # Validate that coverage is 100%
          php -r "
          if (!file_exists('coverage.xml')) {
              echo 'ERROR: coverage.xml file was not generated\n';
              exit(1);
          }

          \$coverage = simplexml_load_file('coverage.xml');
          if (\$coverage === false) {
              echo 'ERROR: Could not read coverage.xml\n';
              exit(1);
          }

          \$metrics = \$coverage->project->metrics;
          \$elements = (float)\$metrics['elements'];
          \$coveredElements = (float)\$metrics['coveredelements'];

          if (\$elements == 0) {
              echo 'No elements to cover\n';
              exit(0);
          }

          \$percentage = (\$coveredElements / \$elements) * 100;

          echo \"Coverage: \$coveredElements/\$elements (\$percentage%)\n\";

          if (\$percentage < 100) {
              echo \"ERROR: Coverage must be 100%. Current: \$percentage%\n\";
              exit(1);
          }

          echo \"✅ 100% coverage confirmed\n\";
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

