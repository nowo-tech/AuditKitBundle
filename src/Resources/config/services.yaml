services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\AuditKitBundle\:
        resource: '../../'
        exclude:
            - '../../ActionLog/'
            - '../../DependencyInjection/'
            - '../../Model/'
            - '../../Attribute/'
            - '../../Doctrine/SqlLike.php'
            - '../../Avatar/AuditAvatarKey.php'
            - '../../Avatar/AvatarUrlPolicy.php'
            - '../../NowoAuditKitBundle.php'

    Nowo\AuditKitBundle\Profile\ProfileRegistry:
        arguments:
            $profiles: '%nowo_audit_kit.profiles%'
            $defaultProfileName: '%nowo_audit_kit.default_profile%'

    Nowo\AuditKitBundle\Doctrine\AuditablePropertyResolver: ~

    Nowo\AuditKitBundle\Security\CurrentUserResolver:
        arguments:
            $firewallMap: '@?security.firewall.map'

    # Kept registered in the entity listener resolver for entities mapping it via #[ORM\EntityListeners].
    Nowo\AuditKitBundle\Doctrine\AuditableEntityListener:
        tags:
            - { name: doctrine.orm.entity_listener, lazy: true }

    # Global listener: a doctrine.orm.entity_listener tag without `entity` is never attached by DoctrineBundle.
    Nowo\AuditKitBundle\Doctrine\AuditableDoctrineListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist, lazy: true }
            - { name: doctrine.event_listener, event: preUpdate, lazy: true }

    # Public UUID helper: independent of profiles (only touches PublicUuidInterface entities).
    Nowo\AuditKitBundle\Doctrine\PublicUuidListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist, lazy: true }

    # Since 1.11: action log avatars. The application overrides the alias with its resolver; the default returns null
    # (no avatar, the timeline renders as before).
    Nowo\AuditKitBundle\Avatar\ActionLogAvatarResolverInterface: '@Nowo\AuditKitBundle\Avatar\NullActionLogAvatarResolver'

    Nowo\AuditKitBundle\Avatar\ActionLogAvatars:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: kernel.reset, method: reset }
