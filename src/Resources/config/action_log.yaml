# Loaded only when nowo_audit_kit.action_log.entity_class is set.
services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    Nowo\AuditKitBundle\ActionLog\ActionLogRecorder:
        arguments:
            $registry: '@doctrine'
            $requestStack: '@request_stack'
            $entityClass: '%nowo_audit_kit.action_log.entity_class%'
            $scopeContextKey: '%nowo_audit_kit.action_log.scope_context_key%'
            $captureIp: '%nowo_audit_kit.action_log.capture_ip%'
            $flushMode: '%nowo_audit_kit.action_log.flush_mode%'
            $logger: '@?logger'

    Nowo\AuditKitBundle\ActionLog\Command\PurgeActionLogCommand:
        arguments:
            $registry: '@doctrine'
            $entityClass: '%nowo_audit_kit.action_log.entity_class%'
            $defaultActions: '%nowo_audit_kit.action_log.purge.actions%'
            $defaultDays: '%nowo_audit_kit.action_log.purge.older_than_days%'
            $batchSize: '%nowo_audit_kit.action_log.purge.batch_size%'
            $clock: '@?Psr\Clock\ClockInterface'
        tags:
            - { name: console.command, command: 'nowo:audit-kit:action-log:purge' }

    # Since 1.12: port for hosts that type-hint the recorder (override the alias to swap it).
    Nowo\AuditKitBundle\ActionLog\ActionLogRecorderInterface: '@Nowo\AuditKitBundle\ActionLog\ActionLogRecorder'

    # Since 1.14: records by user id (AbstractIdActionLog stores them; AbstractActionLog turns them into references).
    Nowo\AuditKitBundle\ActionLog\ActionLogIdRecorderInterface: '@Nowo\AuditKitBundle\ActionLog\ActionLogRecorder'

    # Since 1.15.1 (REQ-SEC-006): binary NO PAD collation on actor_id / subject_id of an id-mode log (MySQL / MariaDB).
    Nowo\AuditKitBundle\Doctrine\ReferenceCollationListener:
        arguments:
            $doctrine: '@doctrine'
            $logger: '@?logger'
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchemaTable }

    # REQ-SEC-006: the same two columns, declared so a host's nowo:migrations:check-key-collations asserts the
    # collation the database really has. The table and column names come from the host's mapping (the log is a mapped
    # superclass), never from a literal. Registered by NowoAuditKitExtension only when MigrationsKitBundle is
    # installed: this bundle does not require it.
